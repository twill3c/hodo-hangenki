# 毎時収集 → 再計算 → 再レンダリング → コミット(F-07)。
# Vercel は Git 連携で main の out/ を配信する(Vercel 上ではビルドしない)。
name: collect

on:
  schedule:
    - cron: "7 * * * *"   # 毎時 7 分(SPEC §5: 1 時間より密にしない)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'   # Imports のみ(survival/testthat は収集ジョブに不要)

      - name: Collect snapshot
        run: Rscript build/01_collect.R

      - name: Recompute lifetimes
        run: Rscript build/02_lifetimes.R

      - name: Render site
        run: Rscript build/03_render.R

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data out
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
