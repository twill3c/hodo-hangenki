<text x='194.07' y='390.73' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='141.17px' lengthAdjust='spacingAndGlyphs'>熱中症搬送者数 8月9日までの1週間で7600人</text>
