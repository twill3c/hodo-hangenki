<text x='194.07' y='533.27' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='153.98px' lengthAdjust='spacingAndGlyphs'>熊本地震 どうする？災害廃棄物 【専門家Q＆A】</text>
<text x='194.07' y='509.51' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>千葉 九十九里町の海水浴場 遊泳中の男性流され死</text>
<text x='194.07' y='485.76' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>半蔵門線ホームでアスベスト 国交省が全国鉄道会社</text>
<text x='194.07' y='462.00' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='127.94px' lengthAdjust='spacingAndGlyphs'>地震で被害受けた熊本城 一般公開が再開</text>
<text x='194.07' y='438.25' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>被災者の体調管理が課題 しんきゅう師派遣も【被災</text>
