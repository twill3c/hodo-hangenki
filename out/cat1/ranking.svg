<text x='194.07' y='197.56' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='177.31px' lengthAdjust='spacingAndGlyphs'>熊本地震 災害関連死の疑い含め39人死亡 避難所(継続中)</text>
<text x='194.07' y='173.80' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='127.16px' lengthAdjust='spacingAndGlyphs'>JR中央・総武線 全線で運転再開(継続中)</text>
<text x='194.07' y='150.05' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='175.36px' lengthAdjust='spacingAndGlyphs'>山形 鶴岡 花火大会で3人軽傷 花火が地上で破裂(継続中)</text>
<text x='194.07' y='126.29' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='174.20px' lengthAdjust='spacingAndGlyphs'>熊本地震 17日も熱中症対策を 最大震度5弱程度(継続中)</text>
<text x='194.07' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='164.88px' lengthAdjust='spacingAndGlyphs'>死者10人に 浸水被害は約1500棟 千葉市で車(継続中)</text>
<text x='194.07' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='137.30px' lengthAdjust='spacingAndGlyphs'>【動画】Pickup NEWS（8月16日）(継続中)</text>
