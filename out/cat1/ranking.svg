<text x='183.50' y='368.59' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Arial";' textLength='171.02px' lengthAdjust='spacingAndGlyphs'>被災者の体調管理が課題 しんきゅう師派遣も【被災(継続中)</text>
<text x='183.50' y='319.03' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Arial";' textLength='150.83px' lengthAdjust='spacingAndGlyphs'>“逃走”ニシキヘビ 見つからず 夜も警戒続ける (継続中)</text>
<text x='183.50' y='269.47' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Arial";' textLength='161.27px' lengthAdjust='spacingAndGlyphs'>熱中症搬送者数 8月9日までの1週間で7600人(継続中)</text>
<text x='183.50' y='219.91' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Arial";' textLength='166.62px' lengthAdjust='spacingAndGlyphs'>熊本 きょうも猛暑日 地震活動依然活発 5弱程度(継続中)</text>
<text x='183.50' y='170.35' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Arial";' textLength='168.86px' lengthAdjust='spacingAndGlyphs'>検事の取り調べ映像 高等検察庁でチェックの取り組(継続中)</text>
<text x='183.50' y='120.79' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Arial";' textLength='170.25px' lengthAdjust='spacingAndGlyphs'>台風17号 南鳥島近海を北東へ進む 今後の情報に(継続中)</text>
