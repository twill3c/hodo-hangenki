<text x='194.07' y='268.83' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>非上場企業の株式 新たな評価方式の案を公表 国税</text>
<text x='194.07' y='245.07' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='188.59px' lengthAdjust='spacingAndGlyphs'>法務省 ネット番組「ラヴ上等」とのタイアップ中止(継続中)</text>
<text x='194.07' y='221.31' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>大気不安定 福島県で猛烈な雨 北日本東日本中心に</text>
<text x='194.07' y='197.56' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>熊本地震 あすも被災地は猛烈な暑さに 午後は局地</text>
<text x='194.07' y='173.80' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='98.00px' lengthAdjust='spacingAndGlyphs'>秋篠宮ご夫妻パラグアイに到着</text>
<text x='194.07' y='150.05' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>鎌倉時代の「元寇の矢」見つかる 元が南宋から接収</text>
<text x='194.07' y='126.29' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='159.83px' lengthAdjust='spacingAndGlyphs'>神戸 女性殺害事件1年「面識ない」ストーカー相談</text>
<text x='194.07' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='111.64px' lengthAdjust='spacingAndGlyphs'>【動画】Pickup NEWS（8月20日）</text>
<text x='194.07' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='152.81px' lengthAdjust='spacingAndGlyphs'>東京 江東区新木場 都営バスとトレーラーが衝突 </text>
<text x='194.07' y='55.02' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='180.42px' lengthAdjust='spacingAndGlyphs'>東武日光線 4人死亡列車事故 ホーム下に緊急避難(継続中)</text>
<text x='194.07' y='533.27' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='153.98px' lengthAdjust='spacingAndGlyphs'>熊本地震 どうする？災害廃棄物 【専門家Q＆A】</text>
<text x='194.07' y='509.51' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>千葉 九十九里町の海水浴場 遊泳中の男性流され死</text>
<text x='194.07' y='485.76' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>半蔵門線ホームでアスベスト 国交省が全国鉄道会社</text>
<text x='194.07' y='462.00' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='127.94px' lengthAdjust='spacingAndGlyphs'>地震で被害受けた熊本城 一般公開が再開</text>
<text x='194.07' y='438.25' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>被災者の体調管理が課題 しんきゅう師派遣も【被災</text>
<text x='194.07' y='414.49' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='143.47px' lengthAdjust='spacingAndGlyphs'>“逃走”ニシキヘビ 見つからず 夜も警戒続ける </text>
<text x='194.07' y='390.73' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='141.17px' lengthAdjust='spacingAndGlyphs'>熱中症搬送者数 8月9日までの1週間で7600人</text>
<text x='194.07' y='366.98' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='149.70px' lengthAdjust='spacingAndGlyphs'>熊本 きょうも猛暑日 地震活動依然活発 5弱程度</text>
<text x='194.07' y='343.22' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>検事の取り調べ映像 高等検察庁でチェックの取り組</text>
<text x='194.07' y='319.47' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='111.64px' lengthAdjust='spacingAndGlyphs'>【動画】Pickup NEWS（8月13日）</text>
