<text x='194.07' y='245.07' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='177.31px' lengthAdjust='spacingAndGlyphs'>上野動物園のパンダ舎 17日から解体 多くの人が(継続中)</text>
