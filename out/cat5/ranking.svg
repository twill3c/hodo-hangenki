<text x='192.54' y='438.25' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>「植物工場」研究拠点開設相次ぐ 最先端技術で食料</text>
<text x='192.54' y='414.49' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='153.61px' lengthAdjust='spacingAndGlyphs'>米トランプ政権 一部のドローン関連部品に100％</text>
