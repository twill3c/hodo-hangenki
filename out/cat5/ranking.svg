<text x='185.90' y='245.07' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='180.42px' lengthAdjust='spacingAndGlyphs'>米雇用統計 8月の就業者は前月比増加 市場予想を(継続中)</text>
<text x='185.90' y='221.31' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='145.44px' lengthAdjust='spacingAndGlyphs'>アメリカ10年債利回り4.8％に迫る 世界的に長</text>
<text x='185.90' y='197.56' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='159.83px' lengthAdjust='spacingAndGlyphs'>長期金利3％超 日銀の金融政策や財政めぐる動きが</text>
<text x='185.90' y='173.80' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>個人向け社債の発行 過去最多更新のペース 成長資</text>
<text x='185.90' y='150.05' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>米財務省が国債買い戻し倍増 長期金利上昇を抑える</text>
<text x='185.90' y='126.29' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='161.41px' lengthAdjust='spacingAndGlyphs'>ホンダと日産「SDV」で基本ソフト共同開発など協</text>
<text x='185.90' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='154.77px' lengthAdjust='spacingAndGlyphs'>政府の備蓄米 9月中に買い戻しの方針 農水省が最</text>
<text x='185.90' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>日本製紙 地震被害の工場復旧見通せず 他社も代替</text>
<text x='185.90' y='55.02' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='143.48px' lengthAdjust='spacingAndGlyphs'>来年度予算案 概算要求 総額は過去最大 143兆</text>
<text x='185.90' y='533.27' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='117.44px' lengthAdjust='spacingAndGlyphs'>円相場 小幅な値動き 1ドル＝159円台</text>
<text x='185.90' y='509.51' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='159.83px' lengthAdjust='spacingAndGlyphs'>東京ガスの子会社 顧客情報約2万件が入ったパソコ</text>
<text x='185.90' y='485.76' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='152.81px' lengthAdjust='spacingAndGlyphs'>株価 値上がり 半導体銘柄中心に買い トピックス</text>
<text x='185.90' y='462.00' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='120.55px' lengthAdjust='spacingAndGlyphs'>7月企業物価 7.2％上昇　高い水準続く</text>
<text x='185.90' y='438.25' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>「植物工場」研究拠点開設相次ぐ 最先端技術で食料</text>
<text x='185.90' y='414.49' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='153.61px' lengthAdjust='spacingAndGlyphs'>米トランプ政権 一部のドローン関連部品に100％</text>
<text x='185.90' y='390.73' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='142.33px' lengthAdjust='spacingAndGlyphs'>株価 一時1200円以上値上がり 4営業日連続で</text>
<text x='185.90' y='366.98' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='156.72px' lengthAdjust='spacingAndGlyphs'>太平洋クロマグロ漁獲枠 18日に関係国・地域と再</text>
<text x='185.90' y='343.22' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>【千葉 大雨】ライフライン・店舗休業など生活情報</text>
<text x='185.90' y='319.47' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='136.91px' lengthAdjust='spacingAndGlyphs'>S＆P500 株価指数が最高値 FRB利上げ観測</text>
