<text x='168.42' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='148.17px' lengthAdjust='spacingAndGlyphs'>FRB 7月の会合議事録“利上げ必要の可能性高い</text>
<text x='168.42' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='151.66px' lengthAdjust='spacingAndGlyphs'>経産省 来年度予算案の概算要求 7兆7千億円規模</text>
