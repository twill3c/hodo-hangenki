<text x='192.54' y='173.80' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>経産省など 家事支援・ベビーシッター利用の税制優</text>
<text x='192.54' y='150.05' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='148.17px' lengthAdjust='spacingAndGlyphs'>FRB 7月の会合議事録“利上げ必要の可能性高い</text>
<text x='192.54' y='126.29' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='151.66px' lengthAdjust='spacingAndGlyphs'>経産省 来年度予算案の概算要求 7兆7千億円規模</text>
<text x='192.54' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>【地震】携帯各社 通話・通信への影響確認されず（</text>
<text x='192.54' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>米財務省が国債買い戻し倍増 長期金利上昇を抑える</text>
<text x='192.54' y='55.02' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='154.77px' lengthAdjust='spacingAndGlyphs'>政府の備蓄米 9月中に買い戻しの方針 農水省が最</text>
<text x='192.54' y='533.27' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='117.44px' lengthAdjust='spacingAndGlyphs'>円相場 小幅な値動き 1ドル＝159円台</text>
<text x='192.54' y='509.51' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='159.83px' lengthAdjust='spacingAndGlyphs'>東京ガスの子会社 顧客情報約2万件が入ったパソコ</text>
<text x='192.54' y='485.76' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='152.81px' lengthAdjust='spacingAndGlyphs'>株価 値上がり 半導体銘柄中心に買い トピックス</text>
