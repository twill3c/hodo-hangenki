<text x='194.07' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='137.28px' lengthAdjust='spacingAndGlyphs'>きょうのおはBiz 8月19日（水） 太平洋クロ</text>
<text x='194.07' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='145.44px' lengthAdjust='spacingAndGlyphs'>株価 一時2300円超値下がり 企業業績への懸念</text>
<text x='194.07' y='55.02' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='150.09px' lengthAdjust='spacingAndGlyphs'>世界的に金利上昇 インフレ・財政悪化懸念 IT巨</text>
