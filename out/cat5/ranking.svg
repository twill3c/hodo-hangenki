<text x='168.42' y='509.51' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='159.83px' lengthAdjust='spacingAndGlyphs'>東京ガスの子会社 顧客情報約2万件が入ったパソコ</text>
