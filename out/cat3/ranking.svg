<text x='194.07' y='245.07' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='149.34px' lengthAdjust='spacingAndGlyphs'>ABUロボコン香港で開催 地元の香港大学が優勝</text>
<text x='194.07' y='221.31' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>新方式で国産初の量子コンピューター稼働開始 分子</text>
<text x='194.07' y='197.56' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='188.59px' lengthAdjust='spacingAndGlyphs'>世界文化遺産の国内候補に「彦根城」推薦決定 文化(継続中)</text>
<text x='194.07' y='173.80' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>鎌倉時代の「元寇の矢」見つかる 元が南宋から接収</text>
<text x='194.07' y='150.05' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='161.78px' lengthAdjust='spacingAndGlyphs'>フェルメール代表作「真珠の耳飾りの少女」14年ぶ</text>
<text x='194.07' y='126.29' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>ベネチア国際映画祭開幕 最優秀賞競う部門に日本の</text>
<text x='194.07' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='155.56px' lengthAdjust='spacingAndGlyphs'>コンゴ民主共和国でエボラ出血熱の死者3000人超</text>
<text x='194.07' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='154.02px' lengthAdjust='spacingAndGlyphs'>NASAが次世代宇宙望遠鏡打ち上げ 従来型望遠鏡</text>
<text x='194.07' y='55.02' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>環境省 除染土再生利用 さいたま市にある合同庁舎</text>
<text x='194.07' y='533.27' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='151.27px' lengthAdjust='spacingAndGlyphs'>火星衛星探査機「MMX」公開 秋にも打ち上げへ</text>
<text x='194.07' y='509.51' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>ニチレイ サイバー攻撃で従業員の氏名など漏えいの</text>
<text x='194.07' y='485.76' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='153.61px' lengthAdjust='spacingAndGlyphs'>「週刊少年ジャンプ」直近の発行部数 100万部を</text>
<text x='194.07' y='462.00' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>戦争体験つづった「ガラスのうさぎ」作者 高木敏子</text>
<text x='194.07' y='438.25' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='155.56px' lengthAdjust='spacingAndGlyphs'>女性研究者支援の大学に年間最大5000万円補助へ</text>
<text x='194.07' y='414.49' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='156.73px' lengthAdjust='spacingAndGlyphs'>NHK杯全国中学校放送コンテスト決勝 各部門の最</text>
<text x='194.07' y='390.73' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>初の女性プロ棋士資格かけた「白玲戦」 西山朋佳は</text>
<text x='194.07' y='366.98' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='142.33px' lengthAdjust='spacingAndGlyphs'>日本学術会議 新会員125人を公表 10月の特殊</text>
<text x='194.07' y='343.22' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='168.00px' lengthAdjust='spacingAndGlyphs'>地下のライブハウスで地震が起きたら？防災の日に避</text>
<text x='194.07' y='319.47' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='149.72px' lengthAdjust='spacingAndGlyphs'>「八日目の蝉」映画監督の成島出さん死去 65歳</text>
