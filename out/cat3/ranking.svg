<text x='188.64' y='414.49' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='156.73px' lengthAdjust='spacingAndGlyphs'>NHK杯全国中学校放送コンテスト決勝 各部門の最</text>
<text x='188.64' y='390.73' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>初の女性プロ棋士資格かけた「白玲戦」 西山朋佳は</text>
<text x='188.64' y='366.98' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='142.33px' lengthAdjust='spacingAndGlyphs'>日本学術会議 新会員125人を公表 10月の特殊</text>
