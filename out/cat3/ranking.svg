<text x='188.64' y='126.29' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='149.34px' lengthAdjust='spacingAndGlyphs'>ABUロボコン香港で開催 地元の香港大学が優勝</text>
<text x='188.64' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>新方式で国産初の量子コンピューター稼働開始 分子</text>
<text x='188.64' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>鎌倉時代の「元寇の矢」見つかる 元が南宋から接収</text>
<text x='188.64' y='55.02' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='161.78px' lengthAdjust='spacingAndGlyphs'>フェルメール代表作「真珠の耳飾りの少女」14年ぶ</text>
