<text x='194.07' y='197.56' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='188.59px' lengthAdjust='spacingAndGlyphs'>西日本中心に午前中から猛暑日も 熱中症対策の徹底(継続中)</text>
<text x='194.07' y='173.80' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='156.72px' lengthAdjust='spacingAndGlyphs'>「OTC類似薬」追加負担めぐり 患者など団体が会</text>
<text x='194.07' y='150.05' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='146.61px' lengthAdjust='spacingAndGlyphs'>個人情報保護委 KDDIに行政指導 メールアドレ</text>
<text x='194.07' y='126.29' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='146.59px' lengthAdjust='spacingAndGlyphs'>防衛省 令和9年度予算案 過去最大 約9兆円要求</text>
<text x='194.07' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='138.42px' lengthAdjust='spacingAndGlyphs'>59歳 カズ 三浦知良 サッカー天皇杯で2得点 </text>
<text x='194.07' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>車水没 ドラレコに記録 「このまま行けると思った</text>
<text x='194.07' y='55.02' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='183.53px' lengthAdjust='spacingAndGlyphs'>熊本地震 被災地は午前中から猛烈な暑さ 熱中症対(継続中)</text>
<text x='194.07' y='533.27' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='122.88px' lengthAdjust='spacingAndGlyphs'>株価 値上がり アメリカの株価上昇受け</text>
<text x='194.07' y='509.51' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='160.22px' lengthAdjust='spacingAndGlyphs'>成田空港で航空機エンジンから煙か A滑走路を点検</text>
<text x='194.07' y='485.76' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='145.44px' lengthAdjust='spacingAndGlyphs'>台風18号 23日には非常に強い勢力に発達か 今</text>
<text x='194.07' y='462.00' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='139.22px' lengthAdjust='spacingAndGlyphs'>7月の貿易収支 6345億円の赤字 3か月連続の</text>
<text x='194.07' y='438.25' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='156.72px' lengthAdjust='spacingAndGlyphs'>イスラエル軍ガザ地区攻撃で10人死亡の報道 和平</text>
<text x='194.07' y='414.49' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>高市首相 トルコ大統領と電話会談 ホルムズ海峡の</text>
<text x='194.07' y='390.73' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>天皇ご一家 千葉豪雨の被災者に 側近通じお見舞い</text>
