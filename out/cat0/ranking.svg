<text x='180.84' y='268.83' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='138.42px' lengthAdjust='spacingAndGlyphs'>59歳 カズ 三浦知良 サッカー天皇杯で2得点 </text>
<text x='180.84' y='245.07' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>車水没 ドラレコに記録 「このまま行けると思った</text>
<text x='180.84' y='221.31' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='154.77px' lengthAdjust='spacingAndGlyphs'>千葉豪雨から1週間 ボランティア本格化 園児受け</text>
<text x='180.84' y='197.56' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>小泉防衛相 インドと通信アンテナ早期移転へ新協議</text>
<text x='180.84' y='173.80' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='175.36px' lengthAdjust='spacingAndGlyphs'>阪神 伊原陵人投手 1軍選手登録を抹消 週刊誌報(継続中)</text>
<text x='180.84' y='150.05' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>千葉豪雨 幹線道路の車両移動は完了も水没車両の対</text>
<text x='180.84' y='126.29' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>大気不安定 福島県で猛烈な雨 北日本東日本中心に</text>
<text x='180.84' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>熊本地震 あすも被災地は猛烈な暑さに 午後は局地</text>
<text x='180.84' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='159.83px' lengthAdjust='spacingAndGlyphs'>栃木 東武日光線の駅で作業員4人が特急と接触し死</text>
<text x='180.84' y='55.02' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='171.09px' lengthAdjust='spacingAndGlyphs'>台風18号 23日には非常に強い勢力に発達か 今(継続中)</text>
<text x='180.84' y='533.27' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>日本製紙八代工場 地震で先端損傷の煙突 来月中旬</text>
<text x='180.84' y='509.51' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='154.77px' lengthAdjust='spacingAndGlyphs'>台湾の防衛費予算案 初の1兆台湾元超に 自衛力強</text>
<text x='180.84' y='485.76' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>首都高 中央環状線内回りで車両火災 広い範囲で通</text>
<text x='180.84' y='462.00' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='122.88px' lengthAdjust='spacingAndGlyphs'>株価 値上がり アメリカの株価上昇受け</text>
<text x='180.84' y='438.25' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='160.22px' lengthAdjust='spacingAndGlyphs'>成田空港で航空機エンジンから煙か A滑走路を点検</text>
<text x='180.84' y='414.49' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='139.22px' lengthAdjust='spacingAndGlyphs'>7月の貿易収支 6345億円の赤字 3か月連続の</text>
<text x='180.84' y='390.73' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='156.72px' lengthAdjust='spacingAndGlyphs'>イスラエル軍ガザ地区攻撃で10人死亡の報道 和平</text>
<text x='180.84' y='366.98' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>高市首相 トルコ大統領と電話会談 ホルムズ海峡の</text>
<text x='180.84' y='343.22' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>天皇ご一家 千葉豪雨の被災者に 側近通じお見舞い</text>
<text x='180.84' y='319.47' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='101.89px' lengthAdjust='spacingAndGlyphs'>【地震速報】茨城県北部で震度3</text>
