<text x='190.96' y='343.22' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>天皇ご一家 千葉豪雨の被災者に 側近通じお見舞い</text>
