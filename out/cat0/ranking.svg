<text x='190.96' y='221.31' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='149.70px' lengthAdjust='spacingAndGlyphs'>高校野球 智弁和歌山 5年ぶり決勝へ 横浜に逆転</text>
