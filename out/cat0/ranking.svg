<text x='182.42' y='268.83' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='146.59px' lengthAdjust='spacingAndGlyphs'>石川 富山 28日にかけ再び大雨のおそれ 土砂災</text>
<text x='182.42' y='245.07' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='150.50px' lengthAdjust='spacingAndGlyphs'>24日は大分で40度予想 西・東日本で猛烈な暑さ</text>
<text x='182.42' y='221.31' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='145.44px' lengthAdjust='spacingAndGlyphs'>台風18号 23日には非常に強い勢力に発達か 今</text>
<text x='182.42' y='197.56' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='134.16px' lengthAdjust='spacingAndGlyphs'>台風20号 先島諸島で大雨 台風18号 25日か</text>
<text x='182.42' y='173.80' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='150.50px' lengthAdjust='spacingAndGlyphs'>近畿で39度超 25日は熊本・大分など「酷暑日」</text>
<text x='182.42' y='150.05' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>福井県で記録的な大雨 土砂災害に引き続き十分注意</text>
<text x='182.42' y='126.29' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='145.44px' lengthAdjust='spacingAndGlyphs'>台風18号 25日以降沖縄・奄美に接近 猛烈な風</text>
<text x='182.42' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>ネパール・中国の国境地帯で土石流 ネパール側の死</text>
<text x='182.42' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='176.94px' lengthAdjust='spacingAndGlyphs'>JR首都圏在来線 6日夜から7日にかけて運休や遅(継続中)</text>
<text x='182.42' y='55.02' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='148.55px' lengthAdjust='spacingAndGlyphs'>ネパール土石流 633人が死亡 二次災害のリスク</text>
<text x='182.42' y='533.27' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>日本製紙八代工場 地震で先端損傷の煙突 来月中旬</text>
<text x='182.42' y='509.51' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='154.77px' lengthAdjust='spacingAndGlyphs'>台湾の防衛費予算案 初の1兆台湾元超に 自衛力強</text>
<text x='182.42' y='485.76' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>首都高 中央環状線内回りで車両火災 広い範囲で通</text>
<text x='182.42' y='462.00' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='122.88px' lengthAdjust='spacingAndGlyphs'>株価 値上がり アメリカの株価上昇受け</text>
<text x='182.42' y='438.25' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='160.22px' lengthAdjust='spacingAndGlyphs'>成田空港で航空機エンジンから煙か A滑走路を点検</text>
<text x='182.42' y='414.49' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='139.22px' lengthAdjust='spacingAndGlyphs'>7月の貿易収支 6345億円の赤字 3か月連続の</text>
<text x='182.42' y='390.73' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='156.72px' lengthAdjust='spacingAndGlyphs'>イスラエル軍ガザ地区攻撃で10人死亡の報道 和平</text>
<text x='182.42' y='366.98' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>高市首相 トルコ大統領と電話会談 ホルムズ海峡の</text>
<text x='182.42' y='343.22' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>天皇ご一家 千葉豪雨の被災者に 側近通じお見舞い</text>
<text x='182.42' y='319.47' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='101.89px' lengthAdjust='spacingAndGlyphs'>【地震速報】茨城県北部で震度3</text>
<text x='324.93' y='568.24' text-anchor='middle' style='font-size: 11.00px; font-family: "Liberation Sans";' textLength='73.31px' lengthAdjust='spacingAndGlyphs'>滞在時間(時間)</text>
<text x='187.35' y='13.74' style='font-size: 12.00px; font-weight: bold; font-family: "Liberation Sans";' textLength='150.66px' lengthAdjust='spacingAndGlyphs'>主要 — 滞在時間ランキング</text>
