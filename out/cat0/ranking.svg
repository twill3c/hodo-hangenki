<text x='189.01' y='150.05' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='146.59px' lengthAdjust='spacingAndGlyphs'>防衛省 令和9年度予算案 過去最大 約9兆円要求</text>
<text x='189.01' y='126.29' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='138.42px' lengthAdjust='spacingAndGlyphs'>59歳 カズ 三浦知良 サッカー天皇杯で2得点 </text>
<text x='189.01' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>車水没 ドラレコに記録 「このまま行けると思った</text>
<text x='189.01' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='183.53px' lengthAdjust='spacingAndGlyphs'>岩手で猛烈な雨か 危険警報の発表も 土砂災害など(継続中)</text>
<text x='189.01' y='55.02' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='183.53px' lengthAdjust='spacingAndGlyphs'>熊本地震 被災地は午前中から猛烈な暑さ 熱中症対(継続中)</text>
<text x='189.01' y='533.27' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='122.88px' lengthAdjust='spacingAndGlyphs'>株価 値上がり アメリカの株価上昇受け</text>
<text x='189.01' y='509.51' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='160.22px' lengthAdjust='spacingAndGlyphs'>成田空港で航空機エンジンから煙か A滑走路を点検</text>
<text x='189.01' y='485.76' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='145.44px' lengthAdjust='spacingAndGlyphs'>台風18号 23日には非常に強い勢力に発達か 今</text>
<text x='189.01' y='462.00' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='139.22px' lengthAdjust='spacingAndGlyphs'>7月の貿易収支 6345億円の赤字 3か月連続の</text>
