<text x='168.42' y='197.56' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='142.53px' lengthAdjust='spacingAndGlyphs'>東京23区 8月の消費者物価指数 前年同月比+1</text>
<text x='168.42' y='173.80' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='147.39px' lengthAdjust='spacingAndGlyphs'>子どものSNS規制 広がる背景は 【Q＆Aで詳し</text>
<text x='168.42' y='150.05' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='148.55px' lengthAdjust='spacingAndGlyphs'>中古マンション価格 東京23区は2か月連続下落 </text>
<text x='168.42' y='126.29' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='143.88px' lengthAdjust='spacingAndGlyphs'>香川 水不足が稲作にも影響 干上がる田んぼも</text>
<text x='168.42' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='148.56px' lengthAdjust='spacingAndGlyphs'>SNSの子どもへの影響 IT大手で被害未然防止の</text>
<text x='168.42' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>経産省など 家事支援・ベビーシッター利用の税制優</text>
<text x='168.42' y='55.02' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='151.66px' lengthAdjust='spacingAndGlyphs'>物価高が続く中で全国一斉の生活相談会(継続中)</text>
<text x='168.42' y='533.27' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='139.22px' lengthAdjust='spacingAndGlyphs'>スーパーのコメ平均価格 5キロ3220円 7週ぶ</text>
<text x='168.42' y='509.51' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='156.72px' lengthAdjust='spacingAndGlyphs'>太平洋クロマグロ漁獲枠 18日に関係国・地域と再</text>
<text x='168.42' y='485.76' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='153.61px' lengthAdjust='spacingAndGlyphs'>「週刊少年ジャンプ」直近の発行部数 100万部を</text>
<text x='168.42' y='462.00' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='155.94px' lengthAdjust='spacingAndGlyphs'>お盆のUターンラッシュ 高速道路でピーク 各地で</text>
<text x='168.42' y='438.25' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='151.66px' lengthAdjust='spacingAndGlyphs'>上野動物園のパンダ舎 17日から解体 多くの人が</text>
<text x='168.42' y='414.49' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='161.00px' lengthAdjust='spacingAndGlyphs'>お盆のUターンラッシュ 新幹線と空の便がピークに</text>
<text x='168.42' y='390.73' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='146.22px' lengthAdjust='spacingAndGlyphs'>JR外房線 17日朝から代行バス運行 一部区間で</text>
<text x='168.42' y='366.98' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>明治 「きのこの山」「たけのこの里」などのお菓子</text>
<text x='168.42' y='343.22' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='154.77px' lengthAdjust='spacingAndGlyphs'>熊本地震1か月 家族介護限界で相談相次ぐ 調整困</text>
<text x='168.42' y='319.47' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>熊本地震 「ラストワンマイル」で支援物資が目詰ま</text>
