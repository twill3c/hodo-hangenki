<text x='175.01' y='268.83' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='156.72px' lengthAdjust='spacingAndGlyphs'>損保ジャパン 自動車保険料を来年1月に平均5％引</text>
<text x='175.01' y='245.07' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>おせち商戦 デパート各社 物価高で価格抑えた商品</text>
<text x='175.01' y='221.31' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>ことしの新米の「概算金」 大幅引き下げ相次ぐ 値</text>
<text x='175.01' y='197.56' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>高校無償化で私立人気が高まる 公立高校の志願者全</text>
<text x='175.01' y='173.80' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>円相場 小幅な値動き 日米の中央銀行幹部の講演控</text>
<text x='175.01' y='150.05' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='169.53px' lengthAdjust='spacingAndGlyphs'>香川 水不足が稲作にも影響 干上がる田んぼも(継続中)</text>
<text x='175.01' y='126.29' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>【比較動画】クマ撃退スプレー 市販製品の「性能」</text>
<text x='175.01' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='148.55px' lengthAdjust='spacingAndGlyphs'>中古マンション価格 東京23区は2か月連続下落 </text>
<text x='175.01' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='148.56px' lengthAdjust='spacingAndGlyphs'>SNSの子どもへの影響 IT大手で被害未然防止の</text>
<text x='175.01' y='55.02' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>経産省など 家事支援・ベビーシッター利用の税制優</text>
<text x='175.01' y='533.27' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='139.22px' lengthAdjust='spacingAndGlyphs'>スーパーのコメ平均価格 5キロ3220円 7週ぶ</text>
<text x='175.01' y='509.51' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='156.72px' lengthAdjust='spacingAndGlyphs'>太平洋クロマグロ漁獲枠 18日に関係国・地域と再</text>
<text x='175.01' y='485.76' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='153.61px' lengthAdjust='spacingAndGlyphs'>「週刊少年ジャンプ」直近の発行部数 100万部を</text>
<text x='175.01' y='462.00' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='155.94px' lengthAdjust='spacingAndGlyphs'>お盆のUターンラッシュ 高速道路でピーク 各地で</text>
<text x='175.01' y='438.25' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='151.66px' lengthAdjust='spacingAndGlyphs'>上野動物園のパンダ舎 17日から解体 多くの人が</text>
<text x='175.01' y='414.49' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='161.00px' lengthAdjust='spacingAndGlyphs'>お盆のUターンラッシュ 新幹線と空の便がピークに</text>
<text x='175.01' y='390.73' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='146.22px' lengthAdjust='spacingAndGlyphs'>JR外房線 17日朝から代行バス運行 一部区間で</text>
<text x='175.01' y='366.98' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>明治 「きのこの山」「たけのこの里」などのお菓子</text>
<text x='175.01' y='343.22' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>熊本地震で被害 八代市長が井戸修理支援を赤間防災</text>
<text x='175.01' y='319.47' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='140.38px' lengthAdjust='spacingAndGlyphs'>四国 早明浦ダム 第４次取水制限へ 2008年以</text>
