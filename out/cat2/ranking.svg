<text x='194.07' y='245.07' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='147.39px' lengthAdjust='spacingAndGlyphs'>韓国の美容医療アプリ 日本ユーザー約4万8000</text>
<text x='194.07' y='221.31' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='157.88px' lengthAdjust='spacingAndGlyphs'>日銀 どう物価安定図るか 今後の利上げも難しい判</text>
<text x='194.07' y='197.56' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='148.56px' lengthAdjust='spacingAndGlyphs'>SNSの子どもへの影響 IT大手で被害未然防止の</text>
<text x='194.07' y='173.80' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>経産省など 家事支援・ベビーシッター利用の税制優</text>
<text x='194.07' y='150.05' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='188.59px' lengthAdjust='spacingAndGlyphs'>アルツハイマー病の原因物質減らす マウスで実験成(継続中)</text>
<text x='194.07' y='126.29' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='138.45px' lengthAdjust='spacingAndGlyphs'>9月の食品値上げは4900品目超　ことし最多</text>
<text x='194.07' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>丈夫な骨の維持には「感覚神経」の働きが重要 東京</text>
<text x='194.07' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='126.00px' lengthAdjust='spacingAndGlyphs'>物価高が続く中で全国一斉の生活相談会</text>
<text x='194.07' y='55.02' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='148.03px' lengthAdjust='spacingAndGlyphs'>5歳男児がマンション11階から転落し死亡 東京 </text>
<text x='194.07' y='533.27' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>東海汽船の飲酒乗務問題 一部船舶に初の使用停止命</text>
<text x='194.07' y='509.51' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='111.64px' lengthAdjust='spacingAndGlyphs'>【動画】Pickup NEWS（9月21日）</text>
<text x='194.07' y='485.76' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='139.22px' lengthAdjust='spacingAndGlyphs'>スーパーのコメ平均価格 5キロ3220円 7週ぶ</text>
<text x='194.07' y='462.00' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='156.72px' lengthAdjust='spacingAndGlyphs'>太平洋クロマグロ漁獲枠 18日に関係国・地域と再</text>
<text x='194.07' y='438.25' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='153.61px' lengthAdjust='spacingAndGlyphs'>「週刊少年ジャンプ」直近の発行部数 100万部を</text>
<text x='194.07' y='414.49' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='155.94px' lengthAdjust='spacingAndGlyphs'>お盆のUターンラッシュ 高速道路でピーク 各地で</text>
<text x='194.07' y='390.73' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='78.94px' lengthAdjust='spacingAndGlyphs'>伝統の灰付けワカメ 富山</text>
<text x='194.07' y='366.98' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='151.66px' lengthAdjust='spacingAndGlyphs'>上野動物園のパンダ舎 17日から解体 多くの人が</text>
<text x='194.07' y='343.22' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='161.00px' lengthAdjust='spacingAndGlyphs'>お盆のUターンラッシュ 新幹線と空の便がピークに</text>
<text x='194.07' y='319.47' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='146.22px' lengthAdjust='spacingAndGlyphs'>JR外房線 17日朝から代行バス運行 一部区間で</text>
