<text x='190.96' y='485.76' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='153.61px' lengthAdjust='spacingAndGlyphs'>「週刊少年ジャンプ」直近の発行部数 100万部を</text>
<text x='190.96' y='462.00' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='155.94px' lengthAdjust='spacingAndGlyphs'>お盆のUターンラッシュ 高速道路でピーク 各地で</text>
<text x='190.96' y='438.25' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='151.66px' lengthAdjust='spacingAndGlyphs'>上野動物園のパンダ舎 17日から解体 多くの人が</text>
<text x='190.96' y='414.49' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='161.00px' lengthAdjust='spacingAndGlyphs'>お盆のUターンラッシュ 新幹線と空の便がピークに</text>
