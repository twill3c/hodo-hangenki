<text x='190.96' y='366.98' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>明治 「きのこの山」「たけのこの里」などのお菓子</text>
