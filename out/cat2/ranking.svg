<text x='189.01' y='462.00' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='153.61px' lengthAdjust='spacingAndGlyphs'>「週刊少年ジャンプ」直近の発行部数 100万部を</text>
<text x='189.01' y='438.25' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='155.94px' lengthAdjust='spacingAndGlyphs'>お盆のUターンラッシュ 高速道路でピーク 各地で</text>
