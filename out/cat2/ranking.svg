<text x='190.96' y='126.29' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='148.55px' lengthAdjust='spacingAndGlyphs'>中古マンション価格 東京23区は2か月連続下落 </text>
<text x='190.96' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='143.88px' lengthAdjust='spacingAndGlyphs'>香川 水不足が稲作にも影響 干上がる田んぼも</text>
<text x='190.96' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='148.56px' lengthAdjust='spacingAndGlyphs'>SNSの子どもへの影響 IT大手で被害未然防止の</text>
<text x='190.96' y='55.02' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>経産省など 家事支援・ベビーシッター利用の税制優</text>
<text x='190.96' y='533.27' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='139.22px' lengthAdjust='spacingAndGlyphs'>スーパーのコメ平均価格 5キロ3220円 7週ぶ</text>
