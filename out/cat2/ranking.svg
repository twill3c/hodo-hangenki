<text x='189.01' y='221.31' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>大手金融グループ 個人向けサービス強化で預金獲得</text>
<text x='189.01' y='197.56' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='147.39px' lengthAdjust='spacingAndGlyphs'>韓国の美容医療アプリ 日本ユーザー約4万8000</text>
<text x='189.01' y='173.80' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='148.56px' lengthAdjust='spacingAndGlyphs'>SNSの子どもへの影響 IT大手で被害未然防止の</text>
<text x='189.01' y='150.05' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>経産省など 家事支援・ベビーシッター利用の税制優</text>
<text x='189.01' y='126.29' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='138.45px' lengthAdjust='spacingAndGlyphs'>9月の食品値上げは4900品目超　ことし最多</text>
<text x='189.01' y='102.53' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='162.94px' lengthAdjust='spacingAndGlyphs'>丈夫な骨の維持には「感覚神経」の働きが重要 東京</text>
<text x='189.01' y='78.78' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='126.00px' lengthAdjust='spacingAndGlyphs'>物価高が続く中で全国一斉の生活相談会</text>
<text x='189.01' y='55.02' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='148.03px' lengthAdjust='spacingAndGlyphs'>5歳男児がマンション11階から転落し死亡 東京 </text>
<text x='189.01' y='533.27' text-anchor='end' style='font-size: 7.00px;fill: #4D4D4D; font-family: "Liberation Sans";' textLength='111.64px' lengthAdjust='spacingAndGlyphs'>【動画】Pickup NEWS（9月21日）</text>
